<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porting Rechner</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="content">
        <h1>2-Takt Porting Rechner</h1>
        <p class="text-muted">Berechnet Steuerzeiten (in Kurbelwinkelgrad) aus Hub, Pleuellänge und Kanalhöhe.</p>

        <section class="card">
            <h2 class="card-title">Motordaten</h2>
            <div class="row">
                <label class="field">
                    <span>Hub (mm)</span>
                    <input type="number" id="stroke" value="54" step="0.1" min="0" />
                </label>
                <label class="field">
                    <span>Pleuellänge (mm)</span>
                    <input type="number" id="rodLength" value="100" step="0.1" min="0" />
                </label>
                <label class="field">
                    <span>Bohrung (mm)</span>
                    <input type="number" id="bore" value="54" step="0.1" min="0" />
                </label>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title">Kanalhöhen (ab OK Kolbenboden im UT)</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Kanal</th>
                            <th>Höhe (mm)</th>
                            <th>Öffnet</th>
                            <th>Schließt</th>
                            <th>Steuerzeit</th>
                        </tr>
                    </thead>
                    <tbody id="ports"></tbody>
                </table>
            </div>
            <button type="button" id="addPort" class="btn">+ Kanal hinzufügen</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
